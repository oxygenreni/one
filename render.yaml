services:
  - type: web
    name: pulse-visualizer
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST_PIN
        sync: false # Render asks for it on first deploy; 4–12 digits
