<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f2f2f">
  <title>Pulse · Display</title>
  <meta name="description" content="Full-screen visuals driven by the room's heartbeats and the music.">
  <meta property="og:title" content="Pulse · Display">
  <meta property="og:description" content="Full-screen visuals driven by the room's heartbeats and the music.">
  <meta property="og:image" content="og.png">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="css/output.css">
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="comboText" class="combo-text" aria-live="polite"></div>
  <div id="gameBanner" class="game-banner" aria-live="polite" hidden></div>

  <div id="start" class="start">
    <div class="start-card">
      <p class="eyebrow"><span class="signal"></span>Live visualizer</p>
      <h1>Pul<span>se</span></h1>
      <p class="lead">A room full of heartbeats, rendered live.</p>
      <button id="startBtn" class="btn primary" type="button">Start display</button>
      <p class="hint">The visuals listen to the computer's <b>system audio</b>. When Chrome asks, choose <b>Entire screen</b>, tick <b>Also share system audio</b>, then click <b>Hide</b> on the sharing bar.</p>
      <img class="qr" src="/api/qr.svg" alt="QR code linking to the phone page" width="180" height="180">
      <p class="hint">Phones scan to join, or open <span id="joinUrl" class="mono">…/input.html</span></p>
      <p id="fatal" class="fatal" hidden></p>
    </div>
  </div>

  <div id="qrCorner" class="qr-corner" hidden>
    <img class="qr" src="/api/qr.svg" alt="QR code linking to the phone page">
    <span>Scan to join</span>
  </div>

  <div id="ui" class="ui">
    <div class="hud hud-left">
      <span><b id="hudBpm">--</b> <span id="hudMode">BPM</span></span>
      <span><b id="hudUsers">0</b> joined</span>
      <button id="hbBtn" class="btn small hb-btn" type="button">Live beat</button>
      <button id="lockBtn" class="btn small lock-btn" type="button">Phones: all</button>
    </div>

    <div class="hud hud-right">
      <button id="audioBtn" class="spectrum-btn" type="button" aria-label="Share system audio"><canvas id="spectrum" width="128" height="22"></canvas></button>
      <span id="audioStatus" class="audio-note" hidden></span>
    </div>

    <nav id="fxBar" class="modes fx-bar" aria-label="Effect layers"></nav>
    <nav id="modes" class="modes" aria-label="Visual mode"></nav>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/output.js"></script>
</body>
</html>
